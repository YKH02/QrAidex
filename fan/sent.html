<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QrAidex - تم الإرسال</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <main class="page">

    <header class="topbar">
      <a href="home.html" class="back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <h1 class="topbar-title">تم الإرسال</h1>
      <span class="badge">QrAidex</span>
    </header>

    <div class="stepper">
      <div class="st"><span class="dot">✓</span><small>الموقع</small></div>
      <div class="line"></div>
      <div class="st"><span class="dot">✓</span><small>نوع الحالة</small></div>
      <div class="line"></div>
      <div class="st"><span class="dot">✓</span><small>إرسال</small></div>
    </div>

    <div class="success">
      <span class="success-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </span>
      <h2>تم إرسال البلاغ</h2>
      <p>ابقَ في مكانك، الفريق في الطريق إليك</p>
    </div>

    <section class="card">
      <div class="row-between">
        <strong>ملخص البلاغ</strong>
        <span class="tag" id="typeTag">-</span>
      </div>
      <div class="loc-grid">
        <div class="loc"><small>القسم</small><b id="locSection">-</b></div>
        <div class="loc"><small>الصف</small><b id="locRow">-</b></div>
        <div class="loc"><small>المقعد</small><b id="locSeat">-</b></div>
      </div>
      <small class="muted" id="consciousText"></small>
      <div class="note-box">
        <small>ملاحظات (اختياري)</small>
        <p id="noteText">لا توجد ملاحظات</p>
      </div>
    </section>

    <section class="card">
      <strong>حالة البلاغ</strong>
      <ul class="timeline">
        <li class="done">تم إرسال البلاغ</li>
        <li class="current">بانتظار استلام الفريق</li>
        <li>الفريق في الطريق</li>
        <li>وصل الفريق</li>
      </ul>
    </section>

    <a class="btn btn-outline" href="home.html">العودة للرئيسية</a>

  </main>

  <script>
    var p = new URLSearchParams(location.search);

    var seat = (p.get('seat') || '').split('-');
    if (seat.length === 3) {
      document.getElementById('locSection').textContent = seat[0];
      document.getElementById('locRow').textContent = seat[1];
      document.getElementById('locSeat').textContent = seat[2];
    }
    if (p.get('type')) document.getElementById('typeTag').textContent = p.get('type');
    if (p.get('c')) document.getElementById('consciousText').textContent = 'المريض واعٍ: ' + (p.get('c') === 'true' ? 'نعم' : 'لا');
    if (p.get('note')) document.getElementById('noteText').textContent = p.get('note');
  </script>
</body>
</html>
