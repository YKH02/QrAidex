<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معلومات الحالة</title>
</head>
<body>

  <h1>معلومات الحالة</h1>

  <div class="card">
    <p>📍 موقعك الحالي (من رمز QR)</p>
    <p>القسم: <b>A12</b></p>
    <p>الصف: <b>R14</b></p>
    <p>المقعد: <b>S08</b></p>
  </div>
  <fieldset>
    <legend>ما نوع الحالة؟</legend>

    <label>
      <input type="radio" name="caseType" value="اختناق">
      اختناق: لقمة أو صعوبة في التنفس
    </label>

    <label>
      <input type="radio" name="caseType" value="إجهاد حراري">
      إجهاد حراري: دوخة، إعياء، حرارة مرتفعة
    </label>

    <label>
      <input type="radio" name="caseType" value="إغماء">
      إغماء: فقدان الوعي أو دوخة شديدة
    </label>
  </fieldset>
</body>
</html>
