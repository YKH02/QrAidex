
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم - QrAidex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">
        <div class="logo-circle">QrAidex</div>
        <div class="header-text">
            <h1>لوحة تحكم المسعفين</h1>
            <p>متابعة البلاغات والاستجابة للحالات الطارئة</p>
        </div>
    </header>

    <main>

        <section class="reports-section">
            <h2>البلاغات الواردة</h2>
            <div id="reports-container"></div>
        </section>

        <section class="statistics">
            <h2>إحصائيات الحالات</h2>

            <div class="stats-grid">

                <div class="stat-card">
                    <h3>إجمالي البلاغات</h3>
                    <p id="total-reports">0</p>
                </div>

                <div class="stat-card">
                    <h3>حالات جديدة</h3>
                    <p id="pending-reports">0</p>
                </div>

                <div class="stat-card">
                    <h3>قيد المعالجة</h3>
                    <p id="progress-reports">0</p>
                </div>

                <div class="stat-card">
                    <h3>حالات تم حلها</h3>
                    <p id="resolved-reports">0</p>
                </div>

            </div>
        </section>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
